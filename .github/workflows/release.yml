name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto follows the Conventional Commits since the last tag
        type: choice
        options: [auto, patch, minor, major]
        default: auto
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Refuse a run off main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release runs only on main, not on $GITHUB_REF."
          exit 1
      - name: Refuse a commit without green CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci&filter=latest" \
            --jq '[.check_runs[].conclusion] | if length == 0 then "missing" elif all(. == "success") then "success" else "not success" end')"
          if [ "$conclusion" != success ]; then
            echo "::error::The ci check of $GITHUB_SHA is $conclusion."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: plan
        name: Compute the version and notes
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/release.mjs plan --bump "$BUMP" > "$RUNNER_TEMP/plan.json"
          node -e 'const p = require(process.argv[1]); require("node:fs").writeFileSync(process.argv[2], p.notes); console.log(`tag=${p.tag}`)' \
            "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  docker:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  deploy:
    needs: [release, docker]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
