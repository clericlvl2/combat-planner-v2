version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
