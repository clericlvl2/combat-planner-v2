<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Rubik:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
html{background:#DCD8CF}body{margin:0;background:#DCD8CF;min-height:100vh;font-family:"Rubik","Noto Sans JP",sans-serif;color:#231F1C;-webkit-font-smoothing:antialiased}
a{color:#231F1C}a:hover{color:#B4232A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="padding:{{ pad }};display:flex;flex-direction:column;gap:{{ gap }};width:{{ rootW }};box-sizing:border-box">
  <sc-if value="{{ showHead }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Flow" embedded="{{ true }}" kind="pageHead" section="Atoms" title="Button" status="Draft" date="15.10.2026" desc="Main actions in bottom bars, sheets, dialogs and forms. Primary, Secondary, Danger and Ghost; S for small actions inside forms." hint-size="1100px,200px"></dc-import>
  </sc-if>
  <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Flow" embedded="{{ true }}" kind="overview" n="2" what="Text button for the main action on a screen, sheet or dialog, with an optional leading icon." where="BottomBar, TurnBar, Sheet, Dialog, EmptyState, MessageScreen, InitiativePopover, PageHeader, UnitRow (Release hero)." behaviour="Tap runs the action. Disabled when the action is unavailable, for example Create without a title. Width hugs content or fills." hint-size="960px,160px"></dc-import>
  </sc-if>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
    <div id="{{ g.id }}" style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:4px">
          <span style="font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700">{{ g.title }}</span>
          <span style="font-size:14px;line-height:1.45;color:#5F574D;max-width:900px;text-wrap:pretty">{{ g.desc }}</span>
        </div>
      </sc-if>
      <div style="display:flex;flex-direction:column;gap:24px"><div style="background:{{ g.frameBg }};border-radius:20px;padding:{{ g.framePad }};display:flex;flex-direction:column;gap:16px">
        <sc-if value="{{ g.showCols }}" hint-placeholder-val="{{ false }}">
          <div style="display:grid;grid-template-columns:{{ g.grid }};gap:24px;padding-bottom:6px;border-bottom:1px solid #E6DDCC">
            <span></span>
            <sc-for list="{{ g.cols }}" as="c" hint-placeholder-count="4"><span style="font-size:12px;font-weight:700;color:#5F574D;letter-spacing:0.04em">{{ c }}</span></sc-for>
          </div>
        </sc-if>
        <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
          <div style="display:grid;grid-template-columns:{{ g.grid }};gap:24px;align-items:center">
            <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600;color:#231F1C;text-wrap:pretty">{{ r.label }}</span></sc-if>
            <sc-for list="{{ r.cells }}" as="b" hint-placeholder-count="1">
              <div style="display:flex;min-width:0;width:{{ b.cellW }};background:{{ b.cellBg }};border-radius:{{ b.cellR }}">

                <sc-if value="{{ b.isButton }}" hint-placeholder-val="{{ true }}">
                  <button style="width:{{ b.w }};height:{{ b.h }};padding:0 {{ b.px }};border:{{ b.border }};border-radius:{{ b.r }};background:{{ b.bg }};color:{{ b.fg }};font-family:{{ b.ff }};font-size:{{ b.fs }};font-weight:{{ b.fw }};display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;outline:{{ b.ring }};outline-offset:2px;white-space:nowrap"><sc-if value="{{ b.hasIcon }}" hint-placeholder-val="{{ false }}"><i class="ti ti-{{ b.icon }}" style="font-size:{{ b.is }}"></i></sc-if>{{ b.label }}</button>
                </sc-if>






              </div>
            </sc-for>
          </div>
        </sc-for>
      </div><sc-if value="{{ g.hasSpec }}" hint-placeholder-val="{{ false }}"><div style="display:flex"><div style="flex:0 1 600px;min-width:0"><dc-import name="Flow" embedded="{{ true }}" kind="spec" spec="{{ g.spec }}" hint-size="100%,200px"></dc-import></div></div></sc-if></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;kind&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;full&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;tap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean | 'minus' | 'plus'&quot;},&quot;aria&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const INK = '#231F1C', LINE = '#E2D8C6', SOFT = '#F3EDE2', OFF = '#E6DDCC', OFF_FG = '#8C8578', RED = '#B4232A';
    const ringOf = (state, tap) => tap ? '3px solid #FFE7A3' : state === 'focus' ? '2px solid #1E5FA8' : 'none';
    const flags = k => ({ isButton: k === 'button', isIcon: k === 'icon', isTool: k === 'tool', isAction: k === 'action', isStepper: k === 'stepper', isBar: k === 'bar' });

    const button = (o) => {
      const v = o.variant || 'primary', s = o.size || 'M', st = o.state || 'default';
      const SZ = { L: [58, 29, 24, 18, 20], M: [58, 29, 24, 18, 20], S: [48, 12, 16, 14, 20] }[s];
      const heavy = (v === 'primary' || v === 'danger') && s !== 'S';
      let bg = { primary: INK, secondary: '#FFFFFF', danger: RED, ghost: 'transparent' }[v];
      let fg = { primary: '#FFFFFF', secondary: INK, danger: '#FFFFFF', ghost: INK }[v];
      let border = v === 'secondary' ? '2px solid ' + LINE : 'none';
      if (st === 'pressed') bg = { primary: '#3A3531', secondary: SOFT, danger: '#9B1C1C', ghost: SOFT }[v];
      if (st === 'disabled') { if (v === 'secondary' || v === 'ghost') { fg = '#8C8578'; border = v === 'secondary' ? '2px solid #E2D8C6' : 'none'; } else { bg = OFF; fg = OFF_FG; } }
      return { ...flags('button'), label: o.label || '', icon: o.icon || '', hasIcon: !!o.icon, w: o.full ? '100%' : 'auto', h: SZ[0] + 'px', r: SZ[1] + 'px', px: SZ[2] + 'px', fs: (heavy ? SZ[3] : s === 'S' ? 14 : SZ[3] + 1) + 'px', is: SZ[4] + 'px', ff: heavy ? "'Unbounded',sans-serif" : "'Rubik','Noto Sans JP',sans-serif", fw: heavy ? 700 : 600, bg, fg, border, ring: ringOf(st, o.tap) };
    };
    const ZS = {
      icon: { S: { zh: 36, is: 16 }, M: { zh: 44, is: 20 }, L: { zh: 52, is: 24 } },
      tool: { S: { zh: 40, is: 16 }, M: { zh: 48, is: 20 }, L: { zh: 56, is: 24 } },
      action: { S: { zh: 40, zfs: 12 }, M: { zh: 48, zfs: 14 }, L: { zh: 56, zfs: 16 } },
      stepper: { S: { zh: 40, zk: 36, valW: 56 }, M: { zh: 48, zk: 44, valW: 64 }, L: { zh: 56, zk: 52, valW: 72 } },
    };
    const sized = (k, f) => (o) => { const r = f(o), z = (ZS[k] || {})[o.size || 'M']; if (!z) return r; const out = { ...r, zh: z.zh + 'px' };
      if (z.is && !(k === 'icon' && (o.variant || 'outline') === 'plain' && (o.size || 'M') === 'M')) out.is = z.is + 'px';
      if (z.zfs) out.zfs = z.zfs + 'px'; if (z.zk) { out.zk = z.zk + 'px'; if (!o.valW) out.valW = z.valW + 'px'; } return out; };
    const MAKE = { button };

    const p = this.props;
    if (p.embedded) {
      const k = p.kind || 'button';
      const b = { ...MAKE[k](p), cellW: '100%', cellBg: 'transparent', cellR: '0' };
      return { gallery: false, pad: '0', gap: '0', rootW: '100%', groups: [{ id: 'one', title: '', desc: '', cols: [], grid: 'minmax(0,1fr)', frameBg: 'transparent', framePad: '0', hasSpec: false, spec: [], showCols: false, rows: [{ label: '', cells: [b] }] }] };
    }

    const S4 = ['default', 'pressed', 'disabled', 'focus'];
    const SPEC = [
      { part: 'Container', v: 'M and L 58 high, radius 29, padding 0 24. S 48 high, radius 12, padding 0 16.', sel: 'button', at: 'tl' },
      { part: 'Icon', v: 'Optional, 20, gap 8 before the label.', sel: 'button i', at: 'b' },
      { part: 'Label', v: 'Primary and Danger M, L: Unbounded 18/700. Others Rubik 600: 19 at M, 14 at S.', sel: 'button', at: 't' },
      { part: 'Fill', v: 'Primary #231F1C, Secondary #FFFFFF with border 2 #E2D8C6, Danger #B4232A, Ghost transparent.', sel: 'button', at: 'r' },
    ];
    const cell = (k, o, w, bg) => ({ ...MAKE[k](o), cellW: w, cellBg: bg || 'transparent', cellR: bg ? '12px' : '0' });
    const G = (id, title, desc, cols, colW, rows) => ({ id, title, desc, cols: cols.map(c => c.toUpperCase()), grid: `160px repeat(${cols.length}, ${colW})`, frameBg: '#FFFFFF', framePad: '24px 28px', hasSpec: false, spec: [], showCols: cols.length > 0, rows });
    const byState = (k, base, w, bg) => S4.map(state => cell(k, { ...base, state }, w, bg));
    return {
      gallery: true, showHead: !new URLSearchParams(location.search).get('embed'), pad: '48px 56px 80px', gap: '36px', rootW: 'max-content',
      groups: [
        { ...G('anatomy', 'Anatomy', 'Primary M with icon. Bottom actions share one rect: 58 high, 28 from the phone edges.', [], '260px', [
          { label: '', cells: [{ ...cell('button', { variant: 'primary', size: 'M', label: 'New combat', icon: 'plus' }, '260px') }] },
        ]), grid: '0px 260px', framePad: '32px 36px', hasSpec: true, spec: SPEC },
        G('variants', 'Variants × states', 'Primary for the main action, Secondary beside it, Danger for deletes, Ghost for Clear.', S4, '240px', [
          { label: 'Primary L + icon', cells: byState('button', { variant: 'primary', size: 'L', label: 'New combat', icon: 'plus' }, '240px') },
          { label: 'Primary M', cells: byState('button', { variant: 'primary', size: 'M', label: 'Save' }, '240px') },
          { label: 'Primary S', cells: byState('button', { variant: 'primary', size: 'S', label: 'Roll d20 +2', icon: 'dice-5' }, '240px') },
          { label: 'Secondary M', cells: byState('button', { variant: 'secondary', size: 'M', label: 'Cancel' }, '240px') },
          { label: 'Danger M', cells: byState('button', { variant: 'danger', size: 'M', label: 'Delete' }, '240px') },
          { label: 'Ghost S', cells: byState('button', { variant: 'ghost', size: 'S', label: 'Clear' }, '240px') },
        ]),
        G('sizes', 'Sizes', 'Height 48 / 58 / 58. M is the default.', ['S', 'M', 'L'], '240px', [
          { label: 'Button · primary', cells: ['S', 'M', 'L'].map(size => cell('button', { variant: 'primary', size, label: 'Save' }, '240px')) },
        ]),
        G('edge', 'Edge cases', 'Longest labels in three languages and full width. Labels never wrap; keep them short.', ['de', 'ru', 'ja', 'full width'], '240px', [
          { label: 'Primary M', cells: [cell('button', { variant: 'primary', label: 'Kampf beginnen' }, '240px'), cell('button', { variant: 'primary', label: 'Начать бой' }, '240px'), cell('button', { variant: 'primary', label: '戦闘開始' }, '240px'), cell('button', { variant: 'primary', label: 'Start combat', full: true }, '240px')] },
          { label: 'Secondary S + icon', cells: [cell('button', { variant: 'secondary', size: 'S', label: 'Held freigeben', icon: 'user-x' }, '240px'), cell('button', { variant: 'secondary', size: 'S', label: 'Освободить героя', icon: 'user-x' }, '240px'), cell('button', { variant: 'secondary', size: 'S', label: 'ヒーローを解放', icon: 'user-x' }, '240px'), cell('button', { variant: 'secondary', size: 'S', label: 'Release hero', icon: 'user-x', full: true }, '240px')] },
        ]),
      ],
    };
  }
}
</script>
</body>
</html>
