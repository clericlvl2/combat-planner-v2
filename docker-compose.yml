services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SOURCE_URL: ${VITE_SOURCE_URL:-}
        VITE_DONATE_URL: ${VITE_DONATE_URL:-}
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '3000'
      DATABASE_PATH: /data/combat-planner.db
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
