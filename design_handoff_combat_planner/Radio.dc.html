<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
html{background:#DCD8CF}body{margin:0;background:#DCD8CF;min-height:100vh;font-family:"Rubik",sans-serif;color:#231F1C;-webkit-font-smoothing:antialiased}
a{color:#231F1C}a:hover{color:#B4232A}
</style>
</helmet>
<div style="padding:{{ pad }};display:flex;flex-direction:column;gap:40px;width:{{ rootW }};box-sizing:border-box">
  <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Flow" embedded="{{ true }}" kind="pageHead" section="Atoms" title="Radio" status="Draft" date="15.10.2026" desc="Single-select mark in RadioList rows: the sort sheets and the language list. Ink only; applies on tap." hint-size="1100px,200px"></dc-import>
    <dc-import name="Flow" embedded="{{ true }}" kind="overview" n="2" what="A mark for picking exactly one option." where="RadioList: Sort combats, Sort presets, Language." behaviour="The whole row is the hit target. Tap selects and applies at once; Done closes the sheet." hint-size="960px,160px"></dc-import>
  </sc-if>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
    <section style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}"><span style="font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700">{{ g.title }}</span></sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
        <sc-for list="{{ g.cells }}" as="b" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:{{ b.cellW }}">
            <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600">{{ b.caption }}</span></sc-if>
            <div style="background:{{ b.stage }};border-radius:12px;padding:{{ b.stagePad }};display:flex">
              <span style="flex:none;width:{{ b.size }};height:{{ b.size }};box-sizing:border-box;border-radius:50%;border:2px solid {{ b.line }};background:#FFFFFF;display:flex;align-items:center;justify-content:center;outline:{{ b.ring }};outline-offset:2px"><sc-if value="{{ b.on }}" hint-placeholder-val="{{ false }}"><span style="width:{{ b.dot }};height:{{ b.dot }};border-radius:50%;background:{{ b.dotBg }}"></span></sc-if></span>
            </div>
          </div>
        </sc-for>
      </div><sc-if value="{{ g.hasSpec }}" hint-placeholder-val="{{ false }}"><div style="flex:0 0 100%;display:flex"><div style="flex:0 1 600px;min-width:0"><dc-import name="Flow" embedded="{{ true }}" kind="spec" spec="{{ g.spec }}" hint-size="100%,200px"></dc-import></div></div></sc-if>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;on&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;square&quot;,&quot;round&quot;],&quot;default&quot;:&quot;square&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;S&quot;,&quot;M&quot;,&quot;L&quot;],&quot;default&quot;:&quot;M&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;disabled&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this._base();
    const fix = c => ({ ...c });
    r.groups = (r.groups || []).map(g => ({ hasSpec: false, spec: [], showCols: !!(g.cols && g.cols.length), ...g, rows: g.rows ? g.rows.map(x => ({ ...x, cells: (x.cells || []).map(fix) })) : g.rows, cells: g.cells ? g.cells.map(fix) : g.cells }));
    return r;
  }
  _base() {
    const SZ = { S: [18, 8], M: [22, 10], L: [26, 12] };
    const box = (o) => { const [s, d] = SZ[o.size || 'M'], on = !!o.on, dis = !!o.disabled;
      return { size: s + 'px', dot: d + 'px', on, line: dis ? '#E6DDCC' : on ? '#231F1C' : '#8C8578', dotBg: dis ? '#E6DDCC' : '#231F1C', ring: o.tap ? '3px solid #FFE7A3' : 'none' }; };
    const p = this.props;
    if (p.embedded) return { gallery: false, pad: '0', rootW: 'auto', groups: [{ title: '', cells: [{ ...box(p), caption: '', cellW: '0', stage: 'transparent', stagePad: '0' }] }] };
    const C = (caption, o) => ({ ...box(o), caption, cellW: '96px', stage: '#FFFFFF', stagePad: '16px' });
    const SPEC = [{"part":"Ring","v":"M 22 (S 18, L 26), border 2. Off #8C8578, on ink. Disabled #E6DDCC."},{"part":"Dot","v":"M 10 (S 8, L 12), ink, centred."},{"part":"Hit target","v":"The whole RadioList row, at least 44 high."}];
    return { gallery: true, pad: '48px 56px 80px', rootW: 'max-content',
      groups: [
        { title: 'Anatomy', cells: [{ ...(C('On, M', { on: true })) }], hasSpec: true, spec: SPEC },
        { title: 'Variants × states', cells: [C('Off', {}), C('On', { on: true }), C('Tap', { on: true, tap: true }), C('Disabled', { disabled: true }), C('On, disabled', { on: true, disabled: true })] },
        { title: 'Sizes', cells: ['S', 'M', 'L'].map(s => C(s, { size: s, on: true })) },
      ] };
  }
}
</script>
</body>
</html>
