<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Rubik:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
html{background:#DCD8CF}body{margin:0;background:#DCD8CF;min-height:100vh;font-family:"Rubik","Noto Sans JP",sans-serif;color:#231F1C;-webkit-font-smoothing:antialiased}
a{color:#231F1C}a:hover{color:#B4232A}
</style>
</helmet>
<div style="padding:{{ pad }};display:flex;flex-direction:column;gap:32px;width:{{ rootW }};box-sizing:border-box">
  <sc-if value="{{ showHead }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Flow" embedded="{{ true }}" kind="pageHead" section="Molecules" title="InitiativePopover" status="Draft" date="15.10.2026" desc="Opens from the role block: the DM sets any unit, a player only their own hero. Stepper ± and Roll d20 + bonus." hint-size="1100px,200px"></dc-import>
  </sc-if>
  <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Flow" embedded="{{ true }}" kind="overview" n="2" what="Small popover to set or roll a unit’s initiative." where="UnitRow (DM, any unit), PlayerRow (own hero). Combat screen CS-F1.5, Player view PV-F2.2." behaviour="Tap − or + changes it by 1. Roll sets d20 + bonus. Tap outside closes." hint-size="960px,160px"></dc-import>
  </sc-if>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:4px"><span style="font-family:'Unbounded',sans-serif;font-size:22px;font-weight:700">{{ g.title }}</span><span style="font-size:14px;line-height:1.45;color:#5F574D;max-width:860px;text-wrap:pretty">{{ g.desc }}</span></div>
      </sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
        <sc-for list="{{ g.cells }}" as="b" hint-placeholder-count="1">
          <div style="display:flex;flex-direction:column;gap:8px;width:{{ b.cellW }}">
            <sc-if value="{{ gallery }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600">{{ b.caption }}</span></sc-if>
            <div style="box-sizing:border-box;background:{{ b.stageBg }};border-radius:{{ b.stageR }};padding:{{ b.stagePad }};display:flex"><sc-if value="{{ b.isArrow }}" hint-placeholder-val="{{ false }}"><dc-import name="Flow" embedded="{{ true }}" kind="arrow" label="{{ b.label }}" width="{{ 110 }}" height="{{ 170 }}" hint-size="110px,170px"></dc-import></sc-if>
              <sc-if value="{{ b.isPop }}" hint-placeholder-val="{{ true }}"><div style="box-sizing:border-box;width:{{ b.w }};background:#FFFFFF;border:2px solid #231F1C;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px">
                <span style="align-self:center;font-size:14px;font-weight:600;white-space:nowrap;text-align:center">{{ b.title }} <span style="font-weight:500;color:#5F574D">({{ b.sub }})</span></span>
                <div style="display:flex;justify-content:center"><dc-import name="Stepper" embedded="{{ true }}" kind="stepper" value="{{ b.value }}" tap="{{ b.stepTap }}" style="width:auto" hint-size="168px,48px"></dc-import></div>
                <dc-import name="Button" embedded="{{ true }}" kind="button" size="S" full="{{ true }}" icon="dice-5" label="{{ b.roll }}" tap="{{ b.rollTap }}" hint-size="100%,48px"></dc-import>
              </div></sc-if>
            </div>
          </div>
        </sc-for>
      <sc-if value="{{ g.hasSpec }}" hint-placeholder-val="{{ false }}"><div style="flex:0 0 100%;display:flex"><div style="flex:0 1 600px;min-width:0"><dc-import name="Flow" embedded="{{ true }}" kind="spec" spec="{{ g.spec }}" hint-size="100%,200px"></dc-import></div></div></sc-if></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;bonus&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;width&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;tap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;'minus' | 'plus' | 'roll'&quot;},&quot;title&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;rollLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const r = this._base();
    const fix = c => ({ isArrow: false, ...c });
    r.groups = (r.groups || []).map(g => ({ hasSpec: false, spec: [], showCols: !!(g.cols && g.cols.length), ...g, rows: g.rows ? g.rows.map(x => ({ ...x, cells: (x.cells || []).map(fix) })) : g.rows, cells: g.cells ? g.cells.map(fix) : g.cells }));
    return r;
  }
  _base() {
    const sg = n => (n ?? 0) >= 0 ? '+' + (n ?? 0) : '−' + Math.abs(n);
    const mk = o => ({ isPop: true, title: o.title || 'Initiative', sub: sg(o.bonus), value: o.value ?? '—', roll: (o.rollLabel || 'Roll d20') + ' ' + sg(o.bonus),
      w: (o.width || 240) + 'px', stepTap: o.tap === 'minus' || o.tap === 'plus' ? o.tap : false, rollTap: o.tap === 'roll' });
    const p = this.props;
    if (p.embedded) return { gallery: false, showHead: false, pad: '0', rootW: 'max-content', groups: [{ cells: [{ ...mk(p), cellW: 'auto', stageBg: 'transparent', stageR: '0', stagePad: '0' }] }] };
    const C = (caption, o) => ({ ...mk(o), caption, cellW: '264px', stageBg: '#FAF6EE', stageR: '16px', stagePad: '12px' });
    const SPEC = [{"part":"Popover","v":"240 wide, border 2 ink, radius 16, padding 12, gap 12."},{"part":"Title","v":"14/600; bonus 500 #5F574D."},{"part":"Stepper","v":"Stepper M: keys 44, field 64."},{"part":"Roll","v":"Button S primary with a die icon: Roll d20 + bonus."}];
    const ANAT = (o) => o;
    return {
      gallery: true, showHead: !new URLSearchParams(location.search).get('embed'), pad: '48px 56px 80px', rootW: 'max-content',
      groups: [
        { title: 'Anatomy', desc: 'Set to 15, bonus +3.', hasSpec: true, spec: SPEC, cells: [ANAT(C('', { value: 15, bonus: 3 }))] },
        { title: 'Variants × states', desc: 'Set, not set yet, tap + and tap Roll.', cells: [
          C('Set', { value: 15, bonus: 3 }), C('No initiative yet', { bonus: 2 }), C('Tap +', { value: 15, bonus: 3, tap: 'plus' }), C('Tap Roll', { value: 15, bonus: 3, tap: 'roll' }) ] },
        { title: 'Edge cases', desc: 'Negative bonus, a two-digit result and ru labels.', cells: [
          C('Negative bonus', { value: 4, bonus: -1 }), C('High roll', { value: 27, bonus: 7 }), C('ru', { title: 'Инициатива', rollLabel: 'Бросить d20', value: 15, bonus: 3 }) ] },
        { title: 'Flow', desc: 'Roll or step, then tap outside to close.', cells: [
          C('Not set, tap Roll', { bonus: 3, tap: 'roll' }), { isArrow: true, isPop: false, label: 'Roll d20 +3', caption: '', cellW: '110px', stageBg: 'transparent', stageR: '0', stagePad: '0' },
          C('Rolled 17', { value: 17, bonus: 3, tap: 'plus' }), { isArrow: true, isPop: false, label: '+1', caption: '', cellW: '110px', stageBg: 'transparent', stageR: '0', stagePad: '0' },
          C('18, tap outside closes', { value: 18, bonus: 3 }) ] },
      ],
    };
  }
}
</script>
</body>
</html>
